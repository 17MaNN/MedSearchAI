<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediRAG — Medical AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0f0d;
      --surface: #111a16;
      --surface2: #172010;
      --border: #1f3028;
      --accent: #3ddc84;
      --accent2: #a8f5c8;
      --text: #e8f5ee;
      --muted: #5a7a66;
      --danger: #ff6b6b;
      --card-bg: #0e1812;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(61,220,132,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,220,132,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(61,220,132,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeDown 0.8s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(61,220,132,0.1);
      border: 1px solid rgba(61,220,132,0.25);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(36px, 6vw, 58px);
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 14px;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    /* Input area */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
      animation: fadeUp 0.8s 0.2s ease both;
      transition: border-color 0.3s;
    }

    .input-card:focus-within {
      border-color: rgba(61,220,132,0.4);
      box-shadow: 0 0 0 4px rgba(61,220,132,0.05);
    }

    .input-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.6;
      resize: none;
      min-height: 80px;
      caret-color: var(--accent);
    }

    textarea::placeholder { color: var(--muted); }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .char-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .ask-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0a0f0d;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .ask-btn:hover:not(:disabled) {
      background: var(--accent2);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(61,220,132,0.25);
    }

    .ask-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ask-btn svg { width: 16px; height: 16px; }

    /* Suggested questions */
    .suggestions {
      margin-bottom: 36px;
      animation: fadeUp 0.8s 0.35s ease both;
    }

    .suggestions-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 100px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .chip:hover {
      border-color: rgba(61,220,132,0.4);
      color: var(--accent);
      background: rgba(61,220,132,0.05);
    }

    /* Result */
    .result {
      animation: fadeUp 0.6s ease both;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .result-icon {
      width: 32px; height: 32px;
      background: rgba(61,220,132,0.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 16px;
      flex-shrink: 0;
    }

    .result-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .result-body {
      padding: 24px;
    }

    .answer-text {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text);
      font-weight: 300;
    }

    /* Context sources */
    .context-section {
      margin-top: 16px;
    }

    .context-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 9px 16px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .context-toggle:hover {
      border-color: rgba(61,220,132,0.3);
      color: var(--accent);
    }

    .context-toggle .arrow {
      margin-left: auto;
      transition: transform 0.3s;
    }

    .context-toggle.open .arrow { transform: rotate(180deg); }

    .context-sources {
      display: none;
      margin-top: 10px;
      gap: 8px;
      flex-direction: column;
    }

    .context-sources.open { display: flex; }

    .source-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid rgba(61,220,132,0.4);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
    }

    .source-num {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .source-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
    }

    /* Loading state */
    .loading {
      display: none;
      text-align: center;
      padding: 48px 0;
      animation: fadeUp 0.4s ease both;
    }

    .loading.active { display: block; }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    .loading-text {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--muted);
    }

    /* Error */
    .error-card {
      background: rgba(255,107,107,0.05);
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      color: var(--danger);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">RAG · Powered by Ollama</div>
      <h1>Medical <em>AI</em><br/>Assistant</h1>
      <p class="subtitle">Ask anything about medical conditions — answers grounded in your knowledge base</p>
    </header>

    <div class="input-card">
      <label class="input-label" for="query">Your Question</label>
      <textarea id="query" rows="3" placeholder="e.g. What is diabetes and how is it treated?"></textarea>
      <div class="input-footer">
        <span class="char-count" id="charCount">0 characters</span>
        <button class="ask-btn" id="askBtn" onclick="askQuestion()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
          Ask
        </button>
      </div>
    </div>

    <div class="suggestions">
      <p class="suggestions-label">Try asking</p>
      <div class="chips">
        <button class="chip" onclick="setQuery(this)">What is diabetes?</button>
        <button class="chip" onclick="setQuery(this)">How does hypertension affect the body?</button>
        <button class="chip" onclick="setQuery(this)">What causes asthma?</button>
        <button class="chip" onclick="setQuery(this)">What are cardiovascular diseases?</button>
        <button class="chip" onclick="setQuery(this)">How is obesity linked to other diseases?</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p class="loading-text">Searching knowledge base...</p>
    </div>

    <div id="resultArea"></div>
  </div>

  <script>
    const textarea = document.getElementById('query');
    const charCount = document.getElementById('charCount');

    textarea.addEventListener('input', () => {
      charCount.textContent = `${textarea.value.length} characters`;
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        askQuestion();
      }
    });

    function setQuery(chip) {
      textarea.value = chip.textContent;
      charCount.textContent = `${textarea.value.length} characters`;
      textarea.focus();
    }

    function toggleContext(btn) {
      btn.classList.toggle('open');
      const sources = btn.nextElementSibling;
      sources.classList.toggle('open');
      btn.querySelector('.label').textContent =
        btn.classList.contains('open') ? 'Hide sources' : 'Show retrieved sources';
    }

    async function askQuestion() {
      const query = textarea.value.trim();
      if (!query) return;

      const btn = document.getElementById('askBtn');
      const loading = document.getElementById('loading');
      const resultArea = document.getElementById('resultArea');

      btn.disabled = true;
      loading.classList.add('active');
      resultArea.innerHTML = '';

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Something went wrong');
        }

        const sourcesHTML = (data.context_used || []).map((src, i) => `
          <div class="source-item">
            <div class="source-num">SOURCE ${i + 1}</div>
            <div class="source-text">${src}</div>
          </div>
        `).join('');

        resultArea.innerHTML = `
          <div class="result">
            <div class="result-card">
              <div class="result-header">
                <div class="result-icon">✦</div>
                <span class="result-title">Answer</span>
              </div>
              <div class="result-body">
                <p class="answer-text">${data.answer.trim()}</p>
              </div>
            </div>
            ${sourcesHTML ? `
            <div class="context-section">
              <button class="context-toggle" onclick="toggleContext(this)">
                <span>📚</span>
                <span class="label">Show retrieved sources</span>
                <span class="arrow">▾</span>
              </button>
              <div class="context-sources">${sourcesHTML}</div>
            </div>` : ''}
          </div>
        `;

      } catch (err) {
        resultArea.innerHTML = `
          <div class="error-card">
            ⚠ ${err.message === 'Failed to fetch'
              ? 'Could not connect to the server. Make sure your Flask app is running on port 5000.'
              : err.message}
          </div>`;
      } finally {
        btn.disabled = false;
        loading.classList.remove('active');
      }
    }
  </script>
</body>
</html>
